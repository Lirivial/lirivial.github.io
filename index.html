<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Lirivial — Музыкальный D.I.Y. проект</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brands.css">
  
  <style>
    /* Принудительное выстраивание кнопок в красивый столбик */
    .music-list {
      max-width: 400px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .music-btn {
      display: block !important;
      width: 100% !important;
      box-sizing: border-box;
      text-align: center;
      padding: 16px 20px;
      margin-bottom: 14px !important;
      border-radius: 30px !important;
      text-decoration: none !important;
      font-weight: bold !important;
      font-family: sans-serif;
      font-size: 16px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .music-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <div class="container" style="text-align: center; padding-top: 40px;">

    <!-- АВА / ОБЛОЖКА -->
    <img class="avatar" src="images/avatar.png" alt="Lirivial" style="width: 120px; height: 120px; border-radius: 50%; margin-bottom: 20px;">

    <!-- ИМЯ ПРОЕКТА -->
    <h1 style="font-size: 32px; margin-bottom: 10px; font-family: sans-serif;">Lirivial</h1>

    <!-- ОПИСАНИЕ -->
    <p style="margin-bottom: 30px; padding: 0 15px; color: #666; line-height: 1.5; font-family: sans-serif;">
      Независимый музыкально-аналитический D.I.Y.-проект.<br>
      Панк-рок, альтернатива, рэп-рок.
    </p>

    <!-- МУЗЫКАЛЬНЫЕ ПЛОЩАДКИ (СТОЛБИКОМ) -->
    <div class="music-list">

      <!-- YANDEX MUSIC -->
      <a class="music-btn" href="https://yandex.ru" target="_blank" rel="noopener" style="background-color: #ffcc00; color: #000000;">Яндекс Музыка</a>

      <!-- VK MUSIC -->
      <a class="music-btn" href="https://vk.com" target="_blank" rel="noopener" style="background-color: #0077ff; color: #ffffff;">VK Музыка</a>

      <!-- SPOTIFY -->
      <a class="music-btn" href="https://spotify.com" target="_blank" rel="noopener" style="background-color: #1ed760; color: #000000;">Listen on Spotify</a>

      <!-- APPLE MUSIC -->
      <a class="music-btn" href="https://apple.com" target="_blank" rel="noopener" style="background-color: #fc3c44; color: #ffffff;">Listen on Apple Music</a>

      <!-- YOUTUBE -->
      <a class="music-btn" href="https://youtube.com" target="_blank" rel="noopener" style="background-color: #ff0000; color: #ffffff;">YouTube канал</a>

      <!-- BOOSTY -->
      <a class="music-btn" href="https://boosty.to" target="_blank" rel="noopener" style="background-color: #f15f22; color: #ffffff;">Скачать треки на Boosty</a>

      <!-- TELEGRAM -->
      <a class="music-btn" href="https://t.me" target="_blank" rel="noopener" style="background-color: #24a1de; color: #ffffff;">Telegram-канал</a>

    </div>

  </div>

</body>
</html>
